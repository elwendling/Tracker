<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09152f">
<title>Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09152f;color:#fff;font-family:"Times New Roman", Times, serif}.app{max-width:520px;margin:auto;padding:24px 16px 90px}h1{color:#f28aae}h2{font-family:"Times New Roman", Times, serif}.card{background:#111e3a;border:1px solid #35405d;border-radius:18px;padding:18px;margin:12px 0}.pink{color:#f28aae}.moods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.mood,button{border:1px solid #3b4764;border-radius:12px;padding:10px;background:#172440;color:#fff}.face{font-size:28px;display:block}input,textarea{width:100%;padding:12px;margin:6px 0 12px;border-radius:10px;border:1px solid #3b4764;background:#0d1933;color:#fff}.bar{height:10px;background:#303b57;border-radius:9px}.bar i{display:block;height:100%;background:#f28aae;border-radius:9px}nav{position:fixed;bottom:0;left:0;right:0;background:#0b1733;border-top:1px solid #35405d;display:flex;justify-content:center}nav button{border:0;background:none;border-radius:0;font-size:11px;flex:1;max-width:75px}.active{color:#f28aae!important}</style>
</head>
<body>
<div class="app"><h1>Tracker</h1><p id="date"></p><div id="content"></div></div>
<nav>
<button onclick="page('home')" id="home">⌂<br>Home</button><button onclick="page('schedule')" id="schedule">▣<br>Schedule</button><button onclick="page('tasks')" id="tasks">☑<br>Tasks</button><button onclick="page('budget')" id="budget">$<br>Budget</button><button onclick="page('journal')" id="journal">▤<br>Journal</button><button onclick="page('goals')" id="goals">◎<br>Goals</button><button onclick="page('nutrition')" id="nutrition">♡<br>Nutrition</button>
</nav>
<script>
const KEY="trackerFullV1";
let d=JSON.parse(localStorage.getItem(KEY)||'{"moods":[],"tasks":[],"schedule":{},"budget":{},"journal":{},"goals":[],"foods":[],"recipes":[]}');
["moods","tasks","schedule","budget","journal","goals","foods","recipes"].forEach(k=>d[k]=d[k]||[]);
function save(){localStorage.setItem(KEY,JSON.stringify(d))}
function todayKey(){return new Date().toISOString().slice(0,10)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function updateDate(){document.getElementById("date").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"})}
const moods=[["😊","Happy"],["😌","Calm"],["😁","Excited"],["😐","Okay"],["😴","Tired"],["😣","Stressed"],["😔","Sad"]];
function moodButtons(){return moods.map(x=>`<button class="mood" onclick="addMood('${x[1]}','${x[0]}')"><span class="face">${x[0]}</span>${x[1]}</button>`).join("")}
function addMood(m,face){let note=prompt("Add a note? (optional)")||"";d.moods.push({date:todayKey(),time:new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}),mood:m,face,note});save();page("home")}
function page(p){updateDate();document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));document.getElementById(p)?.classList.add("active");let c=document.getElementById("content");({home:home,schedule:schedule,tasks:tasks,budget:budget,journal:journal,goals:goals,nutrition:nutrition}[p])(c)}
function home(c){
 let tm=d.moods.filter(x=>x.date===todayKey()), done=d.tasks.filter(x=>x.done).length, cal=d.foods.filter(x=>x.date===todayKey()).reduce((a,x)=>a+Number(x.cal||0),0);
 c.innerHTML=`<div class="card"><h3 class="pink">HOW ARE YOU FEELING?</h3><div class="muted">You can log as many mood changes as you want.</div><div class="moods">${moodButtons()}</div></div>
 <div class="card"><div style="display:flex;justify-content:space-between"><h3>TODAY'S KEY TO-DOS</h3><button onclick="page('tasks')" style="background:none;border:0;color:var(--pink)">Edit</button></div>
 ${d.tasks.filter(x=>!x.done).slice(0,6).map(x=>`<div class="moodrow">○ <span style="flex:1">${esc(x.name)}</span><span class="pill">${esc(x.priority)}</span></div>`).join("")||'<div class="empty">Nothing waiting on you.</div>'}</div>
 <div class="row"><div class="card"><h3>☑ TASKS</h3><b>${done}/${d.tasks.length}</b><div class="muted">completed</div></div><div class="card"><h3>♡ NUTRITION</h3><b>${cal}</b><div class="muted">calories today</div></div></div>
 <div class="card"><h3 class="pink">MOOD TODAY</h3>${tm.map(x=>`<div class="moodrow"><span class="smallface">${x.face}</span><span style="flex:1"><b>${x.mood}</b><br><span class="muted">${x.time}${x.note?" · "+esc(x.note):""}</span></span></div>`).join("")||'<div class="empty">No moods logged yet today.</div>'}</div>`;
}
function schedule(c){
 let k=todayKey(), rows=d.schedule[k]||{};
 c.innerHTML=`<div class="card"><h2>Schedule</h2><p class="pink">Today</p><p><i>“Art enables us to find ourselves and lose ourselves at the same time.”</i></p>${Array.from({length:17},(_,n)=>{let h=n+6;return `<div class="moodrow"><span class="muted" style="width:48px">${h}:00</span><input id="sch${h}" value="${esc(rows[h]||"")}" placeholder="Add event..."></div>`}).join("")}<button onclick="saveSchedule()" style="width:100%;padding:12px;border:0;border-radius:11px;background:var(--pink);color:#fff">Save Today's Schedule</button></div>`;
}
function saveSchedule(){let k=todayKey();d.schedule[k]={};for(let h=6;h<=22;h++)d.schedule[k][h]=document.getElementById("sch"+h)?.value||"";save();page("schedule")}
function tasks(c){
 let done=d.tasks.filter(x=>x.done).length;
 c.innerHTML=`<div class="card"><h2>Daily Tasks</h2><div class="progress"><i style="width:${d.tasks.length?done/d.tasks.length*100:0}%"></i></div><p>${done}/${d.tasks.length} completed</p>
 <h3 class="pink">Daily Tasks</h3>${d.tasks.filter(x=>x.every).map(taskRow).join("")||'<div class="empty">Add everyday tasks below.</div>'}
 <h3 class="pink">High Priority</h3>${d.tasks.filter(x=>!x.every&&x.priority==="High").map(taskRow).join("")}
 <h3 class="pink">Medium Priority</h3>${d.tasks.filter(x=>!x.every&&x.priority==="Medium").map(taskRow).join("")}
 <h3 class="pink">Low Priority</h3>${d.tasks.filter(x=>!x.every&&x.priority==="Low").map(taskRow).join("")}
 <button onclick="addTask()" style="width:100%;padding:12px;border:0;border-radius:11px;background:var(--pink);color:#fff">＋ Add Task</button></div>`;
}
function taskRow(x){let i=d.tasks.indexOf(x);return `<div class="moodrow"><input type="checkbox" style="width:22px" ${x.done?"checked":""} onchange="toggleTask(${i})"><span style="flex:1;${x.done?"text-decoration:line-through;opacity:.55":""}">${esc(x.name)}</span><span class="pill">${esc(x.priority)}</span></div>`}
function addTask(){let n=prompt("What do you need to do?");if(!n)return;let p=prompt("Priority: High, Medium, or Low","Medium")||"Medium";let every=confirm("Make this an everyday task?");d.tasks.push({name:n,priority:["High","Medium","Low"].includes(p)?p:"Medium",every,done:false,created:todayKey()});save();page("tasks")}
function toggleTask(i){d.tasks[i].done=!d.tasks[i].done;save();page("tasks");if(d.tasks.length&&d.tasks.every(x=>x.done))alert("🎉 I'm all done!")}
function budget(c){
 let b=d.budget[todayKey()]||{};
 c.innerHTML=`<div class="card"><h2>Budget</h2><p class="muted">Current week</p>${["income","house","gas","eating","fun","saving"].map((id,i)=>`<label>${["Paycheck / Income","House / Rent","Gas","Eating Out","Fun","Savings"][i]}</label><input id="bud${id}" type="number" value="${b[id]||""}" placeholder="$0">`).join("")}<button onclick="saveBudget()" style="width:100%;padding:12px;border:0;border-radius:11px;background:var(--pink);color:#fff">Save Week</button></div><div class="card"><h3 class="pink">Budget History</h3>${Object.keys(d.budget).map(k=>`<p>${k} — $${d.budget[k].income||0} income</p>`).join("")||"No previous weeks yet."}</div>`;
}
function saveBudget(){let k=todayKey();d.budget[k]={income:+budincome.value||0,house:+budhouse.value||0,gas:+budgas.value||0,eating:+budeating.value||0,fun:+budfun.value||0,saving:+budsaving.value||0};save();page("budget")}
function journal(c){
 let k=todayKey(),j=d.journal[k]||{},tm=d.moods.filter(x=>x.date===k);
 c.innerHTML=`<div class="card"><h2>Journal</h2><h3 class="pink">☀ Morning</h3><p>What are you excited about for today?</p><textarea id="jm">${esc(j.morning||"")}</textarea><h3 class="pink">☾ Night</h3><p>What was your favorite part of the day?</p><textarea id="jn">${esc(j.night||"")}</textarea><h3 class="pink">General Journal</h3><textarea id="jg" placeholder="Write whatever is on your mind...">${esc(j.general||"")}</textarea><button onclick="saveJournal()" style="width:100%;padding:12px;border:0;border-radius:11px;background:var(--pink);color:#fff">Save Journal</button></div>
 <div class="card"><h3 class="pink">Today's Moods</h3>${tm.map(x=>`<div class="moodrow">${x.face}<span style="flex:1">${x.mood}</span><span class="muted">${x.time}</span></div>`).join("")||'<div class="empty">Mood entries from Home appear here automatically.</div>'}</div>`;
}
function saveJournal(){let k=todayKey();d.journal[k]={morning:jm.value,night:jn.value,general:jg.value};save();page("journal")}
function goals(c){
 c.innerHTML=`<div class="card"><h2>Goals</h2><div class="tabs"><button>Daily</button><button>Weekly</button><button>Monthly</button><button>Yearly</button></div>${d.goals.map((g,i)=>`<div class="moodrow"><span class="pink">◎</span><span style="flex:1"><b>${esc(g.name)}</b><br><div class="progress" style="margin-top:6px"><i style="width:${g.progress||0}%"></i></div></span><span>${g.progress||0}%</span></div>`).join("")||'<div class="empty">No goals yet.</div>}<button onclick="addGoal()" style="width:100%;padding:12px;border:0;border-radius:11px;background:var(--pink);color:#fff">＋ Add Goal</button></div>`;
}
function addGoal(){let n=prompt("Goal name");if(!n)return;let p=Number(prompt("Current progress %","0"))||0;d.goals.push({name:n,progress:Math.max(0,Math.min(100,p)),history:[{date:todayKey(),progress:p}]});save();page("goals")}
function nutrition(c){
 let foods=d.foods.filter(x=>x.date===todayKey()),total=foods.reduce((a,x)=>a+Number(x.cal||0),0);
 c.innerHTML=`<div class="card"><h2>Nutrition</h2><p class="muted">Today</p><h3>Calories</h3><b>${total} / 2,000</b><div class="progress" style="margin-top:8px"><i style="width:${Math.min(total/2000*100,100)}%"></i></div><p class="muted">Carbs · Protein · Fat</p></div>
 ${["Breakfast","Lunch","Dinner","Snack","Sweet Treat"].map(meal=>`<div class="card"><h3>${meal}</h3>${foods.filter(x=>x.meal===meal).map(x=>`<div class="moodrow">• <span style="flex:1">${esc(x.name)}</span><span>${x.cal} cal</span></div>`).join("")||'<div class="empty">Nothing added yet.</div>'}<button onclick="addFood('${meal}')" style="padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:#172440;color:#fff">＋ Add Food</button></div>`).join("")}
 <div class="card"><h3 class="pink">📖 Cookbook</h3><p>Breakfast · Lunch · Dinner · Snack · Sweet Treat</p><button onclick="cookbook()" style="padding:10px 13px;border-radius:10px;background:#172440;border:1px solid var(--line);color:#fff">Open Cookbook</button></div>`;
}
function addFood(meal){let n=prompt("Food name");if(!n)return;let cal=Number(prompt("Calories","0"))||0;d.foods.push({date:todayKey(),meal,name:n,cal});save();page("nutrition")}
function cookbook(){let c=document.getElementById("content");c.innerHTML=`<div class="card"><h2>Cookbook</h2><p class="muted">Choose a section</p>${["Breakfast","Lunch","Dinner","Snack","Sweet Treat"].map(x=>`<button onclick="recipes('${x}')" style="width:100%;margin:5px 0;padding:13px;text-align:left;border-radius:11px;background:#172440;border:1px solid var(--line);color:#fff">${x}</button>`).join("")}<button onclick="page('nutrition')" style="margin-top:10px;background:none;border:0;color:var(--pink)">← Back to Nutrition</button></div>`}
function recipes(meal){let r=d.recipes.filter(x=>x.meal===meal);document.getElementById("content").innerHTML=`<div class="card"><h2>${meal}</h2>${r.map(x=>`<div class="card"><h3 class="pink">${esc(x.name)}</h3><p>${esc(x.ingredients)}</p><p>${esc(x.directions)}</p></div>`).join("")||'<div class="empty">No recipes yet.</div>}<button onclick="addRecipe('${meal}')" style="width:100%;padding:12px;border:0;border-radius:11px;background:var(--pink);color:#fff">＋ Add Recipe</button><button onclick="cookbook()" style="margin-top:10px;background:none;border:0;color:var(--pink)">← Contents</button></div>`}
function addRecipe(meal){let name=prompt("Recipe name");if(!name)return;let ingredients=prompt("Ingredients")||"";let directions=prompt("Directions")||"";d.recipes.push({meal,name,ingredients,directions});save();recipes(meal)}
page("home");
</script></body></html>
