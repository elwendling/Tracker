function greeting(){
  const h=new Date().getHours();
  if(h<12) return "Good morning";
  if(h<17) return "Good afternoon";
  if(h<21) return "Good evening";
  return "Good night";
}
function faceSVG(type){
  const fills={happy:"#f28aae",calm:"#b9a1e5",excited:"#f4c94f",okay:"#f1d4a7",tired:"#9bbce8",stressed:"#f19b8e",sad:"#9bbce8"};
  const f=fills[type]||"#f28aae";
  const eyes = {
    happy:`<path d="M17 23 q4-5 8 0 M29 23 q4-5 8 0" stroke="#17233d" stroke-width="2.8" fill="none" stroke-linecap="round"/>`,
    calm:`<path d="M17 24 q4 4 8 0 M29 24 q4 4 8 0" stroke="#17233d" stroke-width="2.8" fill="none" stroke-linecap="round"/>`,
    excited:`<path d="M16 21 l6 3 l-5 4 M40 21 l-6 3 l5 4" stroke="#17233d" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`,
    okay:`<circle cx="21" cy="24" r="2.2" fill="#17233d"/><circle cx="35" cy="24" r="2.2" fill="#17233d"/>`,
    tired:`<path d="M17 25 q4 4 8 0 M29 25 q4 4 8 0" stroke="#17233d" stroke-width="2.8" fill="none" stroke-linecap="round"/><text x="35" y="18" font-size="8" fill="#17233d">z</text><text x="40" y="13" font-size="6" fill="#17233d">z</text>`,
    stressed:`<path d="M17 21 l7 4 M24 21 l-7 4 M32 21 l7 4 M39 21 l-7 4" stroke="#17233d" stroke-width="2.4" stroke-linecap="round"/><path d="M20 34 q8-7 16 0" stroke="#17233d" stroke-width="2.8" fill="none" stroke-linecap="round"/>`,
    sad:`<circle cx="21" cy="24" r="2.2" fill="#17233d"/><circle cx="35" cy="24" r="2.2" fill="#17233d"/><path d="M20 35 q8-7 16 0" stroke="#17233d" stroke-width="2.8" fill="none" stroke-linecap="round"/>`
  };
  const mouths = {
    happy:`<path d="M18 31 q7 8 16 0" stroke="#17233d" stroke-width="2.8" fill="none" stroke-linecap="round"/>`,
    calm:`<path d="M21 31 q5 4 10 0" stroke="#17233d" stroke-width="2.8" fill="none" stroke-linecap="round"/>`,
    excited:`<path d="M18 30 q9 7 18 0 q-1 9-9 9 q-8 0-9-9" fill="#17233d"/>`,
    okay:`<path d="M19 34 q9-2 18 0" stroke="#17233d" stroke-width="2.8" fill="none" stroke-linecap="round"/>`,
    tired:`<path d="M20 33 q7 3 14 0" stroke="#17233d" stroke-width="2.8" fill="none" stroke-linecap="round"/>`,
    stressed:`<path d="M20 34 q8-6 16 0" stroke="#17233d" stroke-width="2.8" fill="none" stroke-linecap="round"/>`,
    sad:`<path d="M20 37 q8-8 16 0" stroke="#17233d" stroke-width="2.8" fill="none" stroke-linecap="round"/>`
  };
  return `<svg class="face-svg" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="26" fill="${f}"/>${eyes[type]}${mouths[type]}</svg>`;
}
function moodFaceButton(name,type){
  return `<button class="mood-btn" onclick="addMood('${name}')"><span class="face-wrap">${faceSVG(type)}</span><span class="mood-label">${name}</span></button>`;
}
function homeTodos(){
  const list=d.tasks.length?d.tasks.slice(0,4):[
    {name:"Work",time:"2:00 PM",done:false,kind:"event"},
    {name:"Gym",time:"6:00 PM",done:false,kind:"event"},
    {name:"Finish assignment",done:false,kind:"pink"},
    {name:"Laundry",done:false,kind:"yellow"}
  ];
  return list.map((x,i)=>{
    if(x.kind==="event") return `<label class="todo-row"><input class="todo-check" type="checkbox" onchange="toggleHomeTodo(${i})" ${x.done?"checked":""}><span class="todo-time">${x.time}</span><span class="todo-name">${x.name}</span></label>`;
    return `<label class="todo-row"><span class="todo-dot ${x.kind==="yellow"?"dot-yellow":"dot-pink"}"></span><input class="todo-check" type="checkbox" onchange="toggleHomeTodo(${i})" ${x.done?"checked":""}><span class="todo-name">${x.name}</span></label>`;
  }).join("");
}
function toggleHomeTodo(i){
  if(d.tasks.length){d.tasks[i].done=!d.tasks[i].done;save();page("home")}
}
function historyItems(){
  const recent=d.moods.slice(-4);
  const fallback=[
    {mood:"Calm",time:"9:15 AM",type:"calm"},
    {mood:"Happy",time:"12:47 PM",type:"happy"},
    {mood:"Stressed",time:"4:32 PM",type:"stressed"},
    {mood:"Excited",time:"8:16 PM",type:"excited"}
  ];
  const items=recent.length?recent.map(x=>({mood:x.mood,time:x.time,type:x.type||x.mood.toLowerCase()})):fallback;
  return items.map(x=>`<div class="history-item"><div class="history-time">${x.time}</div><div class="history-face">${faceSVG(x.type)}</div><div class="history-name">${x.mood}</div></div>`).join("");
}
function addMoodFromPlus(){
  const names=["Happy","Calm","Excited","Okay","Tired","Stressed","Sad"];
  const m=prompt("How are you feeling?\n\n"+names.join(" • "));
  if(names.includes(m)) addMood(m);
}
function showMoodHistory(){alert(d.moods.length?d.moods.map(x=>`${x.time} — ${x.mood}`).join("\n"):"No moods logged yet.");}

function scheduleDateObj(){
  if(!d.scheduleDate)d.scheduleDate=new Date().toISOString().slice(0,10);
  return new Date(d.scheduleDate+"T12:00:00");
}
function scheduleDayName(){return scheduleDateObj().toLocaleDateString(undefined,{weekday:"long"})}
function scheduleDateLabel(){return scheduleDateObj().toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"})}
function changeScheduleDay(delta){
  const x=scheduleDateObj();x.setDate(x.getDate()+delta);
  d.scheduleDate=x.toISOString().slice(0,10);save();page("schedule");
}
function scheduleTimeline(){
  const acts=(d.activities||[]).filter(a=>a.date===d.scheduleDate).sort((a,b)=>a.start.localeCompare(b.start));
  let out="";
  for(let h=6;h<=22;h++){
    const hh=String(h).padStart(2,"0");
    const here=acts.filter(a=>Number(a.start.split(":")[0])===h);
    const label=h<12?`${h} AM`:h===12?"12 PM":`${h-12} PM`;
    out+=`<div class="hour-row"><div class="hour-label">${label}</div><div class="hour-slot">`;
    if(!here.length)out+=`<div class="empty-space"></div>`;
    here.forEach(a=>{
      out+=`<div class="activity" style="background:${a.color||"#2a2440"}" onclick="removeActivity('${a.id}')">
        <div class="activity-title"><span class="activity-icon">${a.icon||"✦"}</span>${escapeHtml(a.name)}</div>
        <div class="activity-time">${formatTime(a.start)} – ${formatTime(a.end)}</div>
      </div>`;
    });
    out+=`</div></div>`;
  }
  return out;
}
function formatTime(t){
  const [hh,mm]=t.split(":").map(Number);const ap=hh>=12?"PM":"AM";const h=hh%12||12;
  return `${h}:${String(mm).padStart(2,"0")} ${ap}`;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

function chooseActivityColor(btn){

function saveNewActivity(){
  const name=document.getElementById("actName").value.trim();
  const start=document.getElementById("actStart").value;
  const end=document.getElementById("actEnd").value;
  if(!name||!start||!end){alert("Please enter an activity name and both times.");return}
  if(end<=start){alert("End time must be after the start time.");return}
  if(!d.activities)d.activities=[];
  d.activities.push({id:Date.now().toString(),date:d.scheduleDate,name,start,end,color:selectedActivityColor,icon:document.getElementById("actIcon").value});

function removeActivity(id){
  if(confirm("Remove this activity?")){d.activities=(d.activities||[]).filter(a=>a.id!==id);save();page("schedule")}
}

let calendarCursor;
function openYearCalendar(){
  const x=scheduleDateObj();
  calendarCursor=new Date(x.getFullYear(),x.getMonth(),1);
  renderCalendar();
  document.getElementById("calendarModal").style.display="flex";
}
function closeYearCalendar(){document.getElementById("calendarModal").style.display="none"}
function closeCalendarIfBackdrop(e){if(e.target.id==="calendarModal")closeYearCalendar()}
function changeCalendarMonth(delta){
  calendarCursor.setMonth(calendarCursor.getMonth()+delta);
  renderCalendar();
}
function renderCalendar(){
  const title=document.getElementById("calendarMonthTitle");
  const grid=document.getElementById("calendarGrid");
  if(!title||!grid)return;
  title.textContent=calendarCursor.toLocaleDateString(undefined,{month:"long",year:"numeric"});
  let html="";
  ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(x=>html+=`<div class="cal-weekday">${x}</div>`);
  const y=calendarCursor.getFullYear(),m=calendarCursor.getMonth();
  const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  for(let i=0;i<first;i++)html+=`<div class="cal-day muted"></div>`;
  for(let day=1;day<=days;day++){
    const date=`${y}-${String(m+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const has=(d.activities||[]).some(a=>a.date===date);
    const selected=date===d.scheduleDate;
    html+=`<button class="cal-day ${has?"has-events ":""}${selected?"selected":""}" onclick="selectCalendarDate('${date}')">${day}</button>`;
  }
  grid.innerHTML=html;
}
function selectCalendarDate(date){
  d.scheduleDate=date;save();closeYearCalendar();page("schedule");
}
