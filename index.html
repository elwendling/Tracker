<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09152f">
<title>Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09152f;color:#fff;font-family:"Times New Roman", Times, serif}.app{max-width:520px;margin:auto;padding:24px 16px 90px}h1{color:#f28aae}h2{font-family:"Times New Roman", Times, serif}.card{background:#111e3a;border:1px solid #35405d;border-radius:18px;padding:18px;margin:12px 0}.pink{color:#f28aae}.moods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.mood,button{border:1px solid #3b4764;border-radius:12px;padding:10px;background:#172440;color:#fff}.face{font-size:28px;display:block}input,textarea{width:100%;padding:12px;margin:6px 0 12px;border-radius:10px;border:1px solid #3b4764;background:#0d1933;color:#fff}.bar{height:10px;background:#303b57;border-radius:9px}.bar i{display:block;height:100%;background:#f28aae;border-radius:9px}nav{position:fixed;bottom:0;left:0;right:0;background:#0b1733;border-top:1px solid #35405d;display:flex;justify-content:center}nav button{border:0;background:none;border-radius:0;font-size:11px;flex:1;max-width:75px}.active{color:#f28aae!important}</style>
</head>
<body>
<div class="app"><h1>Tracker</h1><p id="date"></p><div id="content"></div></div>
<nav>
<button onclick="page('home')" id="home">⌂<br>Home</button><button onclick="page('schedule')" id="schedule">▣<br>Schedule</button><button onclick="page('tasks')" id="tasks">☑<br>Tasks</button><button onclick="page('budget')" id="budget">$<br>Budget</button><button onclick="page('journal')" id="journal">▤<br>Journal</button><button onclick="page('goals')" id="goals">◎<br>Goals</button><button onclick="page('nutrition')" id="nutrition">♡<br>Nutrition</button>
</nav>
<script>
const K="trackerData";let d=JSON.parse(localStorage.getItem(K)||'{"moods":[],"tasks":[]}');const save=()=>localStorage.setItem(K,JSON.stringify(d));document.getElementById("date").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});
function page(p){document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));document.getElementById(p).classList.add("active");let c=document.getElementById("content");
if(p=="home")c.innerHTML=`
<style>
.home-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.home-title{margin:0;color:#f28aae;font-size:29px;letter-spacing:-.3px}
.bell{width:42px;height:42px;border:1px solid #35405d;border-radius:14px;background:#111e3a;color:#f28aae;display:flex;align-items:center;justify-content:center;font-size:23px}
.home-date{margin:0 0 14px;color:#e9edf7;font-size:16px}
.home-card{background:#0e1b36;border:1px solid #34405d;border-radius:18px;padding:16px;margin:12px 0}
.section-title{color:#f28aae;font-size:18px;margin:0 0 5px}
.section-subtitle{color:#c8cfdd;font-size:13px;margin:0 0 12px}
.mood-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 7px}
.mood-btn{border:0!important;background:transparent!important;padding:0!important;color:#fff!important}
.face-wrap{width:54px;height:54px;border-radius:50%;margin:0 auto 5px;display:flex;align-items:center;justify-content:center}
.face-svg{width:54px;height:54px}
.mood-label{font-size:13px;line-height:1.1}
.note-input{margin-top:12px!important;margin-bottom:0!important;height:42px}
.todo-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.edit-btn{background:none;border:0;color:#f28aae;font-family:inherit;font-size:14px;padding:0}
.todo-list{border:1px solid #34405d;border-radius:13px;overflow:hidden}
.todo-row{display:flex;align-items:center;gap:10px;padding:9px 11px;border-bottom:1px solid #34405d;min-height:39px}
.todo-row:last-child{border-bottom:0}
.todo-check{appearance:none;-webkit-appearance:none;width:21px;height:21px;border:1.7px solid #aeb7c8;border-radius:6px;background:transparent;margin:0;flex:none}
.todo-check:checked{background:#f28aae;border-color:#f28aae;position:relative}
.todo-check:checked:after{content:"✓";position:absolute;color:#10203b;font-size:16px;font-weight:bold;left:3px;top:-1px}
.todo-time{width:58px;color:#e9edf7;font-size:13px}
.todo-name{font-size:14px;color:#f5f7fb}
.todo-dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot-pink{background:#f27e82}.dot-yellow{background:#f4c84d}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick-card{background:#0e1b36;border:1px solid #34405d;border-radius:16px;padding:12px;min-height:91px}
.quick-top{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:bold}
.quick-icon{font-size:20px}
.quick-value{font-size:22px;margin-top:6px}
.quick-sub{font-size:12px;color:#d0d5e0}
.quick-bar{height:7px;background:#303b57;border-radius:8px;margin-top:9px;overflow:hidden}
.quick-bar i{display:block;height:100%;border-radius:8px}
.pinkbar{background:#f28aae}.greenbar{background:#9bd66e}.yellowbar{background:#f1ca64}.bluebar{background:#86b8ec}
.mood-history{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.history-item{text-align:center;border-right:1px solid #34405d;padding:0 4px}
.history-item:last-child{border-right:0}
.history-time{font-size:11px;color:#d8dce6;margin-bottom:6px}
.history-face{margin:auto;width:38px;height:38px}
.history-name{font-size:11px;margin-top:4px}
.float-plus{display:flex;align-items:center;justify-content:center;width:62px;height:62px;border-radius:50%;background:#f28aae;color:white;font-size:38px;line-height:1;border:0;margin:12px auto 0;box-shadow:0 5px 16px rgba(242,138,174,.25)}
</style>

<div class="home-header">
  <h1 class="home-title">${greeting()}, Ella!</h1>
  <button class="bell" aria-label="Notifications" onclick="alert('No new notifications')">♧</button>
</div>
<p class="home-date">${new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}</p>

<div class="home-card">
  <h3 class="section-title">HOW ARE YOU FEELING?</h3>
  <p class="section-subtitle">Tap a mood to log how you feel</p>
  <div class="mood-grid">
    ${moodFaceButton("Happy","happy")}
    ${moodFaceButton("Calm","calm")}
    ${moodFaceButton("Excited","excited")}
    ${moodFaceButton("Okay","okay")}
    ${moodFaceButton("Tired","tired")}
    ${moodFaceButton("Stressed","stressed")}
    ${moodFaceButton("Sad","sad")}
  </div>
  <input class="note-input" id="moodNote" placeholder="✎  Add a note (optional)...">
</div>

<div class="home-card">
  <div class="todo-head">
    <h3 class="section-title" style="color:#fff;margin:0">TODAY'S KEY TO-DOS</h3>
    <button class="edit-btn" onclick="addTask()">Edit</button>
  </div>
  <div class="todo-list">
    ${homeTodos()}
  </div>
</div>

<div class="quick-grid">
  <div class="quick-card">
    <div class="quick-top"><span class="quick-icon">✓</span> TASKS</div>
    <div class="quick-value">${d.tasks.filter(x=>x.done).length} / ${d.tasks.length || 7}</div>
    <div class="quick-sub">completed</div>
    <div class="quick-bar"><i class="pinkbar" style="width:${d.tasks.length?Math.round(d.tasks.filter(x=>x.done).length/d.tasks.length*100):71}%"></i></div>
  </div>
  <div class="quick-card">
    <div class="quick-top"><span class="quick-icon">🍎</span> NUTRITION</div>
    <div class="quick-value">1,420</div>
    <div class="quick-sub">/ 2,000 cal</div>
    <div class="quick-bar"><i class="greenbar" style="width:71%"></i></div>
  </div>
  <div class="quick-card">
    <div class="quick-top"><span class="quick-icon">◎</span> GOALS</div>
    <div class="quick-value">3</div>
    <div class="quick-sub">on track</div>
    <div class="quick-bar"><i class="yellowbar" style="width:68%"></i></div>
  </div>
  <div class="quick-card">
    <div class="quick-top"><span class="quick-icon">▣</span> BUDGET</div>
    <div class="quick-value">$327</div>
    <div class="quick-sub">left this week</div>
    <div class="quick-bar"><i class="bluebar" style="width:66%"></i></div>
  </div>
</div>

<div class="home-card">
  <div class="todo-head">
    <h3 class="section-title" style="color:#fff;margin:0">MOOD TODAY</h3>
    <button class="edit-btn" onclick="showMoodHistory()">View all</button>
  </div>
  <div class="mood-history">
    ${historyItems()}
  </div>
</div>

<button class="float-plus" onclick="addMoodFromPlus()" aria-label="Add mood">+</button>
`;

function greeting(){
  const h=new Date().getHours();
  if(h<12) return "Good morning";
  if(h<17) return "Good afternoon";
  if(h<21) return "Good evening";
  return "Good night";
}
function faceSVG(type){
  const fills={happy:"#f28aae",calm:"#b9a1e5",excited:"#f4c94f",okay:"#f1d4a7",tired:"#9bbce8",stressed:"#f19b8e",sad:"#9bbce8"};
  const f=fills[type]||"#f28aae";
  const eyes = {
    happy:`<path d="M17 23 q4-5 8 0 M29 23 q4-5 8 0" stroke="#17233d" stroke-width="2.8" fill="none" stroke-linecap="round"/>`,
    calm:`<path d="M17 24 q4 4 8 0 M29 24 q4 4 8 0" stroke="#17233d" stroke-width="2.8" fill="none" stroke-linecap="round"/>`,
    excited:`<path d="M16 21 l6 3 l-5 4 M40 21 l-6 3 l5 4" stroke="#17233d" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`,
    okay:`<circle cx="21" cy="24" r="2.2" fill="#17233d"/><circle cx="35" cy="24" r="2.2" fill="#17233d"/>`,
    tired:`<path d="M17 25 q4 4 8 0 M29 25 q4 4 8 0" stroke="#17233d" stroke-width="2.8" fill="none" stroke-linecap="round"/><text x="35" y="18" font-size="8" fill="#17233d">z</text><text x="40" y="13" font-size="6" fill="#17233d">z</text>`,
    stressed:`<path d="M17 21 l7 4 M24 21 l-7 4 M32 21 l7 4 M39 21 l-7 4" stroke="#17233d" stroke-width="2.4" stroke-linecap="round"/><path d="M20 34 q8-7 16 0" stroke="#17233d" stroke-width="2.8" fill="none" stroke-linecap="round"/>`,
    sad:`<circle cx="21" cy="24" r="2.2" fill="#17233d"/><circle cx="35" cy="24" r="2.2" fill="#17233d"/><path d="M20 35 q8-7 16 0" stroke="#17233d" stroke-width="2.8" fill="none" stroke-linecap="round"/>`
  };
  const mouths = {
    happy:`<path d="M18 31 q7 8 16 0" stroke="#17233d" stroke-width="2.8" fill="none" stroke-linecap="round"/>`,
    calm:`<path d="M21 31 q5 4 10 0" stroke="#17233d" stroke-width="2.8" fill="none" stroke-linecap="round"/>`,
    excited:`<path d="M18 30 q9 7 18 0 q-1 9-9 9 q-8 0-9-9" fill="#17233d"/>`,
    okay:`<path d="M19 34 q9-2 18 0" stroke="#17233d" stroke-width="2.8" fill="none" stroke-linecap="round"/>`,
    tired:`<path d="M20 33 q7 3 14 0" stroke="#17233d" stroke-width="2.8" fill="none" stroke-linecap="round"/>`,
    stressed:`<path d="M20 34 q8-6 16 0" stroke="#17233d" stroke-width="2.8" fill="none" stroke-linecap="round"/>`,
    sad:`<path d="M20 37 q8-8 16 0" stroke="#17233d" stroke-width="2.8" fill="none" stroke-linecap="round"/>`
  };
  return `<svg class="face-svg" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="26" fill="${f}"/>${eyes[type]}${mouths[type]}</svg>`;
}
function moodFaceButton(name,type){
  return `<button class="mood-btn" onclick="addMood('${name}')"><span class="face-wrap">${faceSVG(type)}</span><span class="mood-label">${name}</span></button>`;
}
function homeTodos(){
  const list=d.tasks.length?d.tasks.slice(0,4):[
    {name:"Work",time:"2:00 PM",done:false,kind:"event"},
    {name:"Gym",time:"6:00 PM",done:false,kind:"event"},
    {name:"Finish assignment",done:false,kind:"pink"},
    {name:"Laundry",done:false,kind:"yellow"}
  ];
  return list.map((x,i)=>{
    if(x.kind==="event") return `<label class="todo-row"><input class="todo-check" type="checkbox" onchange="toggleHomeTodo(${i})" ${x.done?"checked":""}><span class="todo-time">${x.time}</span><span class="todo-name">${x.name}</span></label>`;
    return `<label class="todo-row"><span class="todo-dot ${x.kind==="yellow"?"dot-yellow":"dot-pink"}"></span><input class="todo-check" type="checkbox" onchange="toggleHomeTodo(${i})" ${x.done?"checked":""}><span class="todo-name">${x.name}</span></label>`;
  }).join("");
}
function toggleHomeTodo(i){
  if(d.tasks.length){d.tasks[i].done=!d.tasks[i].done;save();page("home")}
}
function historyItems(){
  const recent=d.moods.slice(-4);
  const fallback=[
    {mood:"Calm",time:"9:15 AM",type:"calm"},
    {mood:"Happy",time:"12:47 PM",type:"happy"},
    {mood:"Stressed",time:"4:32 PM",type:"stressed"},
    {mood:"Excited",time:"8:16 PM",type:"excited"}
  ];
  const items=recent.length?recent.map(x=>({mood:x.mood,time:x.time,type:x.type||x.mood.toLowerCase()})):fallback;
  return items.map(x=>`<div class="history-item"><div class="history-time">${x.time}</div><div class="history-face">${faceSVG(x.type)}</div><div class="history-name">${x.mood}</div></div>`).join("");
}
function addMoodFromPlus(){
  const names=["Happy","Calm","Excited","Okay","Tired","Stressed","Sad"];
  const m=prompt("How are you feeling?\n\n"+names.join(" • "));
  if(names.includes(m)) addMood(m);
}
function showMoodHistory(){alert(d.moods.length?d.moods.map(x=>`${x.time} — ${x.mood}`).join("\n"):"No moods logged yet.");}
;
if(p=="schedule")c.innerHTML=`<div class="card"><h2>Schedule</h2><p><i>“Art enables us to find ourselves and lose ourselves at the same time.”</i></p>${Array.from({length:17},(_,i)=>`<p>${i+6}:00 <input placeholder="What are you doing?"></p>`).join("")}</div>`;
if(p=="tasks")c.innerHTML=`<div class="card"><h2>Daily Tasks</h2><div class="bar"><i style="width:${d.tasks.length?d.tasks.filter(x=>x.done).length/d.tasks.length*100:0}%"></i></div><p>${d.tasks.filter(x=>x.done).length}/${d.tasks.length} completed</p>${d.tasks.map((x,i)=>`<p><input type="checkbox" onchange="done(${i})" ${x.done?"checked":""}> ${x.name} — ${x.priority}</p>`).join("")}<button onclick="addTask()">＋ Add Task</button></div>`;
if(p=="budget")c.innerHTML=`<div class="card"><h2>Budget</h2><p>Current week</p>${["Paycheck / income","House / Rent","Gas","Eating Out","Fun","Savings"].map(x=>`<label>${x}</label><input type="number" placeholder="$0">`).join("")}<button>Save Week</button></div>`;
if(p=="journal")c.innerHTML=`<div class="card"><h2>Journal</h2><h3 class="pink">☀ Morning</h3><p>What are you excited about for today?</p><textarea></textarea><h3 class="pink">☾ Night</h3><p>What was your favorite part of the day?</p><textarea></textarea><h3 class="pink">General Journal</h3><textarea></textarea><button>Save Journal</button></div>`;
if(p=="goals")c.innerHTML=`<div class="card"><h2>Goals</h2><p>Daily · Weekly · Monthly · Yearly</p><p>Track progress and keep your history here.</p><button>＋ Add Goal</button></div>`;
if(p=="nutrition")c.innerHTML=`<div class="card"><h2>Nutrition</h2><div class="bar"><i style="width:42%"></i></div><p>1,420 / 2,000 calories</p><p>Carbs · Protein · Fat</p></div>${["Breakfast","Lunch","Dinner","Snack","Sweet Treat"].map(x=>`<div class="card"><h3>${x}</h3><p>No food added</p><button>＋ Add Food</button></div>`).join("")}<div class="card"><h3 class="pink">📖 Cookbook</h3><p>Breakfast · Lunch · Dinner · Snack · Sweet Treat</p></div>`;
}
function addMood(m){let types={"Happy":"happy","Calm":"calm","Excited":"excited","Okay":"okay","Tired":"tired","Stressed":"stressed","Sad":"sad"};let note=document.getElementById("moodNote")?.value||"";d.moods.push({mood:m,type:types[m],note,time:new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}),date:new Date().toLocaleDateString()});save();page("home")}
function addTask(){let n=prompt("What do you need to do?");if(n){let p=prompt("Priority: high, medium, or low","medium");d.tasks.push({name:n,priority:p||"medium",done:false});save();page("tasks")}}
function done(i){d.tasks[i].done=!d.tasks[i].done;save();page("tasks")}
page("home");
</script></body></html>
